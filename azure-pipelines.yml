trigger:
  - main

pool:
  name: LocalPool   # Tu agente local registrado en Azure DevOps

variables:
  projectDir: '.'
  frontDir: '$(projectDir)/todo-frontend'

  #--- Variables para JMeter ---
  jmxFile: 'tests/stress_test_pipeline.jmx'
  resultsFolder: 'results'
  resultsFile: '$(resultsFolder)/results.jtl'
  htmlReport: '$(resultsFolder)/html'

steps:
  # Paso 1: Chequear el c�digo
  - checkout: self
    fetchDepth: 0
    submodules: true

  # Paso 2: Verificar versi�n de Java
  - script: java -version
    displayName: "Verificar versi�n de Java (usando el del agente local)"
    workingDirectory: $(projectDir)

  # Paso 3: Ejecutar compilaci�n y pruebas unitarias
  - task: Gradle@2
    inputs:
      workingDirectory: '$(projectDir)'
      gradleWrapperFile: '$(projectDir)/gradlew'
      gradleOptions: '-Dfile.encoding=UTF-8 -Xmx3072m'
      publishJUnitResults: true
      testResultsFiles: '**/build/test-results/test/TEST-*.xml'
      tasks: 'clean build test'

  # Paso 4: Ejecutar pruebas de aceptaci�n
  - task: Gradle@2
    inputs:
      workingDirectory: '$(projectDir)'
      gradleWrapperFile: '$(projectDir)/gradlew'
      gradleOptions: '-Dfile.encoding=UTF-8'
      tasks: 'acceptanceTest'
      testResultsFiles: '**/build/test-results/acceptanceTest/TEST-*.xml'
      publishJUnitResults: true

  # Paso 5: Ejecutar pruebas de mutaci�n
  - task: Gradle@2
    inputs:
      workingDirectory: '$(projectDir)'
      gradleWrapperFile: '$(projectDir)/gradlew'
      gradleOptions: '-Dfile.encoding=UTF-8'
      tasks: 'pitest'

  # Paso 6: An�lisis con SonarQube
  - task: Gradle@2
    inputs:
      workingDirectory: '$(projectDir)'
      gradleWrapperFile: '$(projectDir)/gradlew'
      gradleOptions: '-Dfile.encoding=UTF-8'
      tasks: 'sonar -Dsonar.projectKey=ToDo -Dsonar.host.url=http://localhost:9000 -Dsonar.token=$(SONAR_TOKEN)'

  # Paso 7: Publicar el Artefacto (.jar)
  - task: PublishPipelineArtifact@1
    displayName: 'Guardar Artefacto en Azure'
    inputs:
      targetPath: '$(projectDir)/build/libs'
      artifact: 'LockiToDo-App'
      publishLocation: 'pipeline'

  # Paso 8: Apagar y limpiar contenedores anteriores
  - script: |
      docker-compose down
    displayName: "Docker: Limpiar Ecosistema Anterior"
    workingDirectory: $(projectDir)

  # Paso 9: Levantar todo el ecosistema con Docker Compose (40s de espera)
  - script: |
      docker-compose up -d --build
      powershell -command "Start-Sleep -Seconds 40"
    displayName: "Docker: Levantar Ecosistema Completo"
    workingDirectory: $(projectDir)

  # Paso 10: Instalar dependencias de Node
  - script: |
      npm install
    displayName: "Cypress: Instalar Dependencias"
    workingDirectory: $(frontDir)

  # Paso 11: Correr la ruta cr�tica activando logs detallados de depuraci�n en CMD
  - script: |
      set DEBUG=cypress:cli,cypress:runner
      npx cypress run --spec "cypress/e2e/ruta_critica.cy.js"
    displayName: "Cypress: Ejecutar Pruebas E2E (Ruta Cr�tica)"
    workingDirectory: $(frontDir)

  # Paso 12: Preparar directorios de resultados
  - script: |
      if exist $(resultsFolder) rmdir /S /Q $(resultsFolder)
      mkdir $(resultsFolder)
    displayName: "JMeter: Preparar Directorios"

  # Paso 13: Ejecutar pruebas de carga con JMeter
  - script: |
      jmeter.bat -n -t "$(jmxFile)" -l "$(resultsFile)" -e -o "$(htmlReport)"
    displayName: "JMeter: Ejecuci�n de Prueba de Rendimiento"

  # Paso 14: Publicar el reporte HTML final en Azure
  - task: PublishBuildArtifacts@1
    displayName: "JMeter: Publicar Reporte HTML"
    inputs:
      PathtoPublish: '$(htmlReport)'
      ArtifactName: 'jmeter-report'
      publishLocation: 'Container'

  # Paso 15: Si las pruebas FALLAN, apagamos
  - script: |
      docker-compose down
    displayName: "Rollback: Apagar entorno por fallo en pruebas"
    workingDirectory: $(projectDir)
    condition: failed()

  # Paso 16: Si las pruebas PASAN, anunciamos el despliegue exitoso
  - script: |
      echo "¡Las pruebas pasaron en verde! El ecosistema LockiToDo se queda corriendo en producción."
    displayName: "Despliegue Exitoso"
    condition: succeeded()