trigger:
  - main

pool:
  name: LocalPool   # Tu agente local registrado en Azure DevOps

variables:
  projectDir: '.'
  frontDir: '$(projectDir)/SistemaDeAutenticacion/frontend'

  #--- Variables para JMeter ---
  jmxFile: 'tests/stress_test_pipeline.jmx'
  resultsFolder: 'results'
  resultsFile: '$(resultsFolder)/results.jtl'
  htmlReport: '$(resultsFolder)/html'

steps:
  # Paso 1: Chequear el código (con submódulos habilitados)
  - checkout: self
    fetchDepth: 0
    submodules: true

  # Paso 2: Verificar versión de Java instalada en el agente local
  - script: java -version
    displayName: "Verificar versión de Java (usando el del agente local)"
    workingDirectory: $(projectDir)

  # Paso 3: Ejecutar compilación y pruebas unitarias
  - task: Gradle@2
    inputs:
      workingDirectory: '$(projectDir)'
      gradleWrapperFile: '$(projectDir)/gradlew'
      gradleOptions: '-Dfile.encoding=UTF-8 -Xmx3072m'
      publishJUnitResults: true
      testResultsFiles: '**/build/test-results/test/TEST-*.xml'
      tasks: 'clean build test'

  # Paso 4: Ejecutar pruebas de aceptación
  - task: Gradle@2
    inputs:
      workingDirectory: '$(projectDir)'
      gradleWrapperFile: '$(projectDir)/gradlew'
      gradleOptions: '-Dfile.encoding=UTF-8'
      tasks: 'acceptanceTest'
      testResultsFiles: '**/build/test-results/acceptanceTest/TEST-*.xml'
      publishJUnitResults: true

  # Paso 5: Ejecutar pruebas de mutación
  - task: Gradle@2
    inputs:
      workingDirectory: '$(projectDir)'
      gradleWrapperFile: '$(projectDir)/gradlew'
      gradleOptions: '-Dfile.encoding=UTF-8'
      tasks: 'pitest'

  # Paso 6: Análisis con SonarQube
  - task: Gradle@2
    inputs:
      workingDirectory: '$(projectDir)'
      gradleWrapperFile: '$(projectDir)/gradlew'
      gradleOptions: '-Dfile.encoding=UTF-8'
      tasks: 'sonar -Dsonar.projectKey=ToDo -Dsonar.host.url=http://localhost:9000 -Dsonar.token=$(SONAR_TOKEN)'

  # Paso 7: Publicar el Artefacto (.jar)
  - task: PublishPipelineArtifact@1
    displayName: 'Guardar Artefacto en Azure'
    inputs:
      targetPath: '$(projectDir)/build/libs'
      artifact: 'LockiToDo-App'
      publishLocation: 'pipeline'

  # Paso 8: Apagar y limpiar contenedores anteriores si existen
  - script: |
      docker-compose down
    displayName: "Docker: Limpiar Ecosistema Anterior"
    workingDirectory: $(projectDir)

  # Paso 9: Levantar todo el ecosistema con Docker Compose (Multi-Frontend + Back)
  - script: |
      docker-compose up -d --build
      powershell -command "Start-Sleep -Seconds 20"
    displayName: "Docker: Levantar Ecosistema Completo"
    workingDirectory: $(projectDir)

  # Paso 10: Instalar dependencias de Node en el frontend de Cypress
  - script: |
      npm install
    displayName: "Cypress: Instalar Dependencias"
    workingDirectory: $(frontDir)

  # Paso 11: Correr la ruta crítica en modo Headless
  - script: |
      npx cypress run --spec "cypress/e2e/ruta_critica.cy.js"
    displayName: "Cypress: Ejecutar Pruebas E2E (Ruta Crítica)"
    workingDirectory: $(frontDir)

  # Paso 12: Preparar directorios de resultados
  - script: |
      if exist $(resultsFolder) rmdir /S /Q $(resultsFolder)
      mkdir $(resultsFolder)
    displayName: "JMeter: Preparar Directorios"

  # Paso 13: Ejecutar pruebas de carga con JMeter
  - script: |
      jmeter.bat -n -t "$(jmxFile)" -l "$(resultsFile)" -e -o "$(htmlReport)"
    displayName: "JMeter: Ejecución de Prueba de Rendimiento"

  # Paso 14: Publicar el reporte HTML final en Azure
  - task: PublishBuildArtifacts@1
    displayName: "JMeter: Publicar Reporte HTML"
    inputs:
      PathtoPublish: '$(htmlReport)'
      ArtifactName: 'jmeter-report'
      publishLocation: 'Container'

  # Paso 15: Apagar contenedores al finalizar de forma segura
  - script: |
      docker-compose down
    displayName: "Docker: Apagar Ecosistema"
    condition: always()
