trigger:
  - main

pool:
  name: LocalPool   # Tu agente local registrado en Azure DevOps

variables:
  projectDir: '.'

  #--- Variables agregadas para JMeter ---
  jmxFile: 'tests/stress_test_pipeline.jmx'
  resultsFolder: 'results'
  resultsFile: '$(resultsFolder)/results.jtl'
  htmlReport: '$(resultsFolder)/html'

steps:
  # Paso 1: Chequear el código
  - checkout: self

  # Paso 2: Verificar versión de Java instalada en el agente local
  - script: java -version
    displayName: "Verificar versión de Java (usando el del agente local)"
    workingDirectory: $(projectDir)

  # Paso 3: Ejecutar compilación y pruebas unitarias
  - task: Gradle@2
    inputs:
      workingDirectory: '$(projectDir)'
      gradleWrapperFile: '$(projectDir)/gradlew'
      gradleOptions: '-Dfile.encoding=UTF-8 -Xmx3072m'
      publishJUnitResults: true
      testResultsFiles: '**/build/test-results/test/TEST-*.xml'
      tasks: 'clean build test'

  # Paso 4: Ejecutar pruebas de aceptación (Cucumber)
  - task: Gradle@2
    inputs:
      workingDirectory: '$(projectDir)'
      gradleWrapperFile: '$(projectDir)/gradlew'
      gradleOptions: '-Dfile.encoding=UTF-8'
      tasks: 'acceptanceTest'
      testResultsFiles: '**/build/test-results/acceptanceTest/TEST-*.xml'
      publishJUnitResults: true

  # Paso 5: Ejecutar pruebas de mutación (Pitest)
  - task: Gradle@2
    inputs:
      workingDirectory: '$(projectDir)'
      gradleWrapperFile: '$(projectDir)/gradlew'
      gradleOptions: '-Dfile.encoding=UTF-8'
      tasks: 'pitest'

  # Paso 6: Análisis con SonarQube
  - task: Gradle@2
    inputs:
      workingDirectory: '$(projectDir)'
      gradleWrapperFile: '$(projectDir)/gradlew'
      gradleOptions: '-Dfile.encoding=UTF-8'
      tasks: 'sonar -Dsonar.projectKey=ToDo -Dsonar.host.url=http://localhost:9000 -Dsonar.token=$(SONAR_TOKEN)'

  # Paso 7: Publicar el Artefacto (Guardar el .jar de la aplicación)
  - task: PublishPipelineArtifact@1
    displayName: 'Guardar Artefacto en Azure'
    inputs:
      targetPath: '$(projectDir)/build/libs'
      artifact: 'LockiToDo-App'
      publishLocation: 'pipeline'

  # Paso 8: Preparar directorios (¡Limpieza profunda primero!)
  - script: |
      echo "Eliminando resultados de la prueba anterior para que JMeter no llore..."
      if exist $(resultsFolder) rmdir /S /Q $(resultsFolder)
      
      echo "Creando carpeta nueva y limpia..."
      mkdir $(resultsFolder)
    displayName: "Preparar directorios JMeter"

  # Paso 9: Iniciar Aplicación Spring Boot
  - script: |
      echo "Arrancando la aplicación..."
      start /B java -jar build/libs/ToDo-1.0-SNAPSHOT.jar
      
      echo "Esperando 15 segundos a que Spring Boot despierte..."
      ping 127.0.0.1 -n 15 > nul
    displayName: "Iniciar Aplicación Spring Boot"

  # Paso 10: Ejecutar prueba de rendimiento con JMeter (¡Usando jmeter.bat!)
  - script: |
      echo "Ejecutando prueba de rendimiento con JMeter..."
      jmeter.bat -n -t "$(jmxFile)" -l "$(resultsFile)" -e -o "$(htmlReport)"
    displayName: "Ejecución de prueba JMeter"

  # Paso 11: Publicar reporte HTML de JMeter como Artefacto
  - task: PublishBuildArtifacts@1
    displayName: "Publicar reporte HTML de JMeter"
    inputs:
      PathtoPublish: '$(htmlReport)'
      ArtifactName: 'jmeter-report'
      publishLocation: 'Container'

  # Paso 12: Apagar la aplicación (¡Súper importante para liberar el puerto 8080!)
  - script: |
      echo "Apagando el servidor Spring Boot en el puerto 8080..."
      for /f "tokens=5" %%a in ('netstat -aon ^| find ":8080" ^| find "LISTENING"') do taskkill /f /pid %%a
    displayName: "Apagar Servidor Spring Boot"
    condition: always() # Esto asegura que se apague incluso si JMeter falla